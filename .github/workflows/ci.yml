name: CI

on:
  push:
    branches: [main, main-with-dashboard]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: uv sync --extra dev
      - name: Run test suite
        run: uv run pytest -q

  smoke-install:
    name: clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Fresh install (no dev extras) and import
        run: |
          uv sync
          uv run python -c "import tradingagents, cli.main; print('clean-install import OK')"

  lint:
    name: ruff (web/ only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Install ruff
        run: uv sync --extra dev
      - name: Lint web directory
        run: uv run ruff check web/

  version-check:
    name: version bump check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version changed
        run: |
          current_version=$(grep '^version = ' pyproject.toml | sed 's/version = "//;s/"//')
          main_version=$(git show origin/main:pyproject.toml 2>/dev/null | grep '^version = ' | sed 's/version = "//;s/"//')
          if [ -z "$main_version" ]; then
            echo "ERROR: could not read version from origin/main"
            exit 1
          fi
          if [ "$current_version" == "$main_version" ]; then
            echo "ERROR: Version not bumped ($main_version). Update version in pyproject.toml"
            exit 1
          fi
          higher=$(printf "%s\n%s" "$main_version" "$current_version" | sort -V | tail -1)
          if [ "$higher" != "$current_version" ]; then
            echo "ERROR: Version must be higher than $main_version (current: $current_version)"
            exit 1
          fi
          if [ -f VERSION ]; then
            version_file=$(tr -d '[:space:]' < VERSION)
            if [ "$version_file" != "$current_version" ]; then
              echo "ERROR: VERSION file ($version_file) does not match pyproject.toml ($current_version)"
              exit 1
            fi
          fi
          echo "Version bumped: $main_version -> $current_version"

  build-and-push:
    name: build and push Docker image
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/main-with-dashboard')
    needs: [test, lint, smoke-install]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build frontend
        run: |
          cd web/frontend
          npm ci
          npm run build
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Authorize Docker to Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev
      - name: Build and push
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/tradingagents-images/app:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
        id: build

  deploy-staging:
    name: deploy to staging
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [build-and-push]
    permissions:
      id-token: write
      contents: read
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Run migrations
        run: |
          gcloud run jobs execute tradingagents-migrate \
            --region ${{ vars.GCP_REGION }} \
            --args="alembic","upgrade","head"
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy tradingagents-staging \
            --image "${{ needs.build-and-push.outputs.image }}" \
            --region ${{ vars.GCP_REGION }}

  deploy-production:
    name: deploy to production
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/main-with-dashboard') && github.event_name == 'push'
    needs: [build-and-push]
    permissions:
      id-token: write
      contents: read
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Run migrations
        run: |
          gcloud run jobs execute tradingagents-migrate \
            --region ${{ vars.GCP_REGION }} \
            --args="alembic","upgrade","head"
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy tradingagents-production \
            --image "${{ needs.build-and-push.outputs.image }}" \
            --region ${{ vars.GCP_REGION }}